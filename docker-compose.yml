services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    user: root
    network_mode: host
    volumes:
      - .:/workspace
      - ./.artifacts:/opt/artifacts:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock
      - /run/kairos-runtime:/run/kairos-runtime
      - /tmp:/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_DRY_RUN: "0"
      SANDBOX_IMAGE: "debian:slim"
      API_KEY: "${API_KEY:-}"
      BASE_URL: "${BASE_URL:-}"
      MODEL: "${MODEL:-}"
      STATE_DAEMON_CLOUD_API_KEY: "${STATE_DAEMON_CLOUD_API_KEY:-}"
      STATE_DAEMON_CLOUD_BASE_URL: "${STATE_DAEMON_CLOUD_BASE_URL:-}"
      STATE_DAEMON_CLOUD_MODEL: "${STATE_DAEMON_CLOUD_MODEL:-}"
      CUSTOM_EMOJI_TO_TEXT_ENABLED: "${CUSTOM_EMOJI_TO_TEXT_ENABLED:-false}"
      CUSTOM_EMOJI_TO_TEXT_MODEL: "${CUSTOM_EMOJI_TO_TEXT_MODEL:-}"
      CUSTOM_EMOJI_TO_TEXT_BASE_URL: "${CUSTOM_EMOJI_TO_TEXT_BASE_URL:-}"
      CUSTOM_EMOJI_TO_TEXT_API_KEY: "${CUSTOM_EMOJI_TO_TEXT_API_KEY:-}"
      CUSTOM_EMOJI_TO_TEXT_MAX_CONCURRENCY: "${CUSTOM_EMOJI_TO_TEXT_MAX_CONCURRENCY:-3}"
      CUSTOM_EMOJI_TO_TEXT_MAX_FRAMES: "${CUSTOM_EMOJI_TO_TEXT_MAX_FRAMES:-5}"
      CUSTOM_EMOJI_TO_TEXT_DB_PATH: "${CUSTOM_EMOJI_TO_TEXT_DB_PATH:-data/memoh.db}"
      VISION_MODEL: "${VISION_MODEL:-}"
      VISION_BASE_URL: "${VISION_BASE_URL:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_DEBUG: "${VISION_DEBUG:-false}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}"
      EMBED_PROVIDER: "ollama"
      VFS_READY_TIMEOUT_SEC: "${VFS_READY_TIMEOUT_SEC:-1800}"
      TELEGRAM_MODE: "${TELEGRAM_MODE:-userbot}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_PHONE: "${TELEGRAM_PHONE:-}"
      TELEGRAM_SESSION_STRING: "${TELEGRAM_SESSION_STRING:-}"
      TELEGRAM_SILENT_STREAM: "${TELEGRAM_SILENT_STREAM:-false}"
      OWNER_USER_ID: "${OWNER_USER_ID:-}"
      ENCLAVE_SEND_MESSAGE_MODE: "${ENCLAVE_SEND_MESSAGE_MODE:-strict}"
      ENCLAVE_LONG_WAIT_HINT_MS: "${ENCLAVE_LONG_WAIT_HINT_MS:-120000}"
      ENCLAVE_STRICT_TEXT_FALLBACK: "${ENCLAVE_STRICT_TEXT_FALLBACK:-true}"
      MEMORY_FILES_ROOT: "/workspace/.runtime/memory_files"
      KAIROS_ENCLAVE_SOCKET: "unix:///run/kairos-runtime/sockets/kairos-runtime-enclave.sock"
      KAIROS_VFS_SOCKET: "unix:///run/kairos-runtime/sockets/kairos-runtime-vfs.sock"
      AGENT_ENCLAVE_BIND_ADDR: "unix:///run/kairos-runtime/sockets/kairos-runtime-enclave.sock"
      AGENT_ENCLAVE_TARGET: "unix:///run/kairos-runtime/sockets/kairos-runtime-enclave.sock"
      MEMORY_VFS_TARGET: "unix:///run/kairos-runtime/sockets/kairos-runtime-vfs.sock"
    command: /workspace/entrypoint.sh

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/src/dashboard
    user: root
    ports:
      - "18080:8080"
    volumes:
      - .:/workspace
      - /run/kairos-runtime:/run/kairos-runtime
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DASHBOARD_AUTH_TOKEN: "${DASHBOARD_AUTH_TOKEN:-yukimochi0721}"
      MEMORY_FILES_ROOT: "/workspace/.runtime/memory_files"
    command: >
      bash -lc "
      bun install && bun run build:ui && bun run start
      "

  sandboxd:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    user: root
    depends_on:
      - app
    volumes:
      - .:/workspace
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock
      - /tmp:/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_IMAGE: "debian:slim"
      BOT_TOKEN: "${BOT_TOKEN:-}"
      API_KEY: "${API_KEY:-}"
    command: >
      bash -lc "
      cargo run --manifest-path src/sandbox/Cargo.toml
      "
    profiles:
      - sandbox
